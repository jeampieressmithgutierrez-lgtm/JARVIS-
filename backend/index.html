<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>J.A.R.V.I.S. • Stark Industries</title>

    <!-- =====================================================
         FUENTES
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link rel="stylesheet" href="css/styles.css">

    <link rel="stylesheet" href="css/hud.css">

    <link rel="stylesheet" href="css/chat.css">

    <link rel="stylesheet" href="css/animations.css">

    <link rel="stylesheet" href="css/responsive.css">

</head>


<body>


<!-- =========================================================
     FONDO
========================================================== -->

<div id="background-container">

    <canvas id="particles-canvas"></canvas>

    <div id="grid-overlay"></div>

    <div id="scan-overlay"></div>

</div>



<!-- =========================================================
     HUD PRINCIPAL
========================================================== -->

<div id="hud">


    <!-- =====================================================
         BARRA SUPERIOR
    ====================================================== -->

    <header id="topbar">


        <!-- IZQUIERDA -->

      <div class="top-brand jarvis-3d-brand">

    <div
        id="jarvis3d-stage"
        aria-label="J.A.R.V.I.S. Artificial Intelligence">
    </div>

    <div class="jarvis3d-accessibility">
        J.A.R.V.I.S. — ARTIFICIAL INTELLIGENCE
    </div>

</div>

        <!-- CENTRO -->

        <div class="top-center">

            <div id="clock">
                00:00:00
            </div>

            <div class="system-line"></div>

        </div>


        <!-- DERECHA -->

        <div class="stark-brand">

            <div class="stark-logo">
                STARK INDUSTRIES
            </div>

            <div class="system-state">

                <span id="status-light"></span>

                <span>ONLINE</span>

            </div>

        </div>


    </header>



    <!-- =====================================================
         CUERPO
    ====================================================== -->

    <div id="main-layout">


        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <aside id="sidebar">


            <!-- USUARIO -->

            <section class="sidebar-section user-section">

                <div class="section-label">
                    USUARIO
                </div>


                <div class="user-account">

                    <div class="user-avatar">
                        ◉
                    </div>


                    <div class="user-info">

                        <div
                            id="user-name"
                            class="user-name"
                        >
                            Invitado
                        </div>

                        <div class="user-status">
                            SESIÓN TEMPORAL
                        </div>

                    </div>

                </div>


                <a
                    href="/auth/google"
                    id="google-login"
                    class="google-login"
                >
                    <span>●</span>
                    INICIAR CON GOOGLE
                </a>

            </section>



            <!-- =================================================
                 HISTORIAL
            ================================================== -->

            <section class="sidebar-section history-section">


                <div class="history-header">

                    <div class="section-label">
                        HISTORIAL
                    </div>


                    <button
                        id="newChatButton"
                        type="button"
                        aria-label="Nueva conversación"
                        title="Nueva conversación"
                    >
                        +
                    </button>

                </div>


                <!-- BUSCADOR -->

                <div class="chat-search">

                    <span>
                        ⌕
                    </span>

                    <input
                        id="chatSearchInput"
                        type="text"
                        placeholder="Buscar chats..."
                        autocomplete="off"
                    >

                </div>


                <!-- HISTORIAL -->

                <div id="chat-history">

                    <!-- JS inserta los chats -->

                </div>

            </section>



            <!-- =================================================
                 ESTADO DEL SISTEMA
            ================================================== -->

            <section class="sidebar-section system-section">


                <div class="section-label">
                    SISTEMA
                </div>


                <div class="system-item">

                    <span>
                        CORE
                    </span>

                    <strong>
                        ACTIVO
                    </strong>

                </div>


                <div class="system-item">

                    <span>
                        GROQ
                    </span>

                    <strong>
                        CONECTADO
                    </strong>

                </div>


                <div class="system-item">

                    <span>
                        RENDER
                    </span>

                    <strong>
                        ONLINE
                    </strong>

                </div>


                <div class="system-item">

                    <span>
                        GITHUB
                    </span>

                    <strong>
                        CONECTADO
                    </strong>

                </div>

            </section>


        </aside>



        <!-- =================================================
             ÁREA CENTRAL
        ================================================== -->

        <main id="chat-container">


            <!-- =================================================
                 BLOB / NÚCLEO JARVIS
            ================================================== -->

            <div id="jarvis-interface">


                <div class="jarvis-blob">

                    <div class="blob-ring ring-outer"></div>

                    <div class="blob-ring ring-middle"></div>

                    <div class="blob-ring ring-inner"></div>


                    <div class="blob-core">

                        <span>
                            J
                        </span>

                    </div>

                </div>


                <div class="interface-status">

                    <span class="status-dot"></span>

                    <span>
                        J.A.R.V.I.S. CORE
                    </span>

                </div>


            </div>



            <!-- =================================================
                 MENSAJES
            ================================================== -->

            <div id="messages">

                <!-- Los mensajes aparecen aquí -->

            </div>


        </main>

    </div>



    <!-- =====================================================
         CONSOLA
    ====================================================== -->

    <footer id="console">


        <div class="console-wrapper">


            <!-- MICRÓFONO -->

            <button
                id="voiceButton"
                class="console-icon-button"
                type="button"
                aria-label="Entrada de voz"
                title="Entrada de voz"
            >
                🎙
            </button>


            <!-- INPUT -->

            <input
                type="text"
                id="messageInput"
                placeholder="Escriba una instrucción..."
                autocomplete="off"
            >


            <!-- ESTADO -->

            <div class="console-status">

                <span></span>

                READY

            </div>


            <!-- ENVIAR -->

            <button
                id="sendButton"
                type="button"
            >
                ENVIAR
            </button>

        </div>


    </footer>


</div>



<!-- =========================================================
     JAVASCRIPT
========================================================== -->

<script src="js/core.js"></script>

<script src="js/background.js"></script>

<script src="js/particles.js"></script>

<script src="js/effects.js"></script>

<script src="js/ui.js"></script>

<script src="js/chat.js"></script>

<script src="js/api.js"></script>

<script src="js/main.js"></script>


</body>

</html>
