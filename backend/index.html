<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>STARK INDUSTRIES // J.A.R.V.I.S AI</title>

<link
href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&family=Share+Tech+Mono&display=swap"
rel="stylesheet">

<style>

:root{

--cyan:#00eaff;
--cyan2:#00aaff;
--gold:#ffb300;

--amber:#ffbf3a;
--amber2:#ffde7a;
--iron:#b62f22;
--redMetal:#7f1d1d;

--bg:#02060d;
--panel:rgba(5,18,30,.70);
--border:rgba(0,234,255,.25);
--text:#ecffff;

}

*{

margin:0;
padding:0;
box-sizing:border-box;

}

html{

height:100%;
scroll-behavior:smooth;

}

body{

background:
radial-gradient(circle at center,#071321 0%,#02060d 70%);
color:var(--text);
font-family:'Share Tech Mono',monospace;
height:100vh;
overflow:hidden;

}

header{

height:70px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 30px;
border-bottom:1px solid var(--border);
background:rgba(0,0,0,.25);
backdrop-filter:blur(10px);
box-shadow:0 0 20px rgba(0,234,255,.08);

}

.logo{

font-family:'Orbitron',sans-serif;
font-size:26px;
font-weight:700;
letter-spacing:6px;
color:var(--cyan);
text-shadow:0 0 18px var(--cyan);

}

.status{

color:var(--gold);
font-size:14px;
letter-spacing:2px;

}

.main{

display:grid;
grid-template-columns:250px 1fr;
height:calc(100vh - 70px);
gap:12px;
padding:12px;

}

.sidebar{

padding:10px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:12px;
background:rgba(5,10,18,.35);
border-right:1px solid rgba(0,234,255,.12);

}

.panel{

background:linear-gradient(
180deg,
rgba(8,18,28,.95),
rgba(3,10,18,.92)
);

border:1px solid rgba(255,180,0,.18);
border-radius:16px;
padding:14px;
margin:0;
box-shadow:

0 0 25px rgba(0,234,255,.08),

0 0 10px rgba(255,70,40,.12),

inset 0 0 25px rgba(255,180,0,.03);

}
   .panel h3{

font-family:'Orbitron';
font-size:12px;
letter-spacing:3px;
margin-bottom:12px;
color:var(--amber);
text-transform:uppercase;

}

.metric{

margin-bottom:18px;

}

.metric label{

display:flex;
justify-content:space-between;
font-size:13px;

}

.progress{

height:8px;
background:rgba(255,255,255,.08);
border-radius:10px;
margin-top:6px;
overflow:hidden;

}

.progress span{

display:block;
height:100%;
background:linear-gradient(90deg,var(--cyan),var(--cyan2));
box-shadow:0 0 12px var(--cyan);

}

.workspace{

display:flex;
flex-direction:column;
height:100%;
overflow:hidden;

}

#canvas3d-container{

position:absolute;
width:100%;
height:100%;
top:0;
left:0;

}

.core-title{

position:absolute;
top:15px;
left:20px;
font-size:13px;
letter-spacing:2px;
color:var(--gold);
z-index:5;

}

.chat{

height:calc(100vh - 120px);
margin:20px;
display:flex;
flex-direction:column;
border:1px solid var(--border);
border-radius:14px;
background:rgba(0,0,0,.25);
overflow:hidden;
box-shadow:0 0 25px rgba(0,234,255,.08);

}

#chatBox{

flex:1;
padding:25px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:20px;
scroll-behavior:smooth;

}
    
/* ===== SCROLLBAR J.A.R.V.I.S ===== */

#chatBox::-webkit-scrollbar{

width:14px;

}

#chatBox::-webkit-scrollbar-track{

background:rgba(0,15,25,.85);
border-left:1px solid rgba(0,234,255,.15);

}

#chatBox::-webkit-scrollbar-thumb{

background:linear-gradient(
180deg,
#00f0ff,
#0099ff
);

border-radius:20px;
border:2px solid rgba(0,0,0,.25);
box-shadow:
0 0 15px #00eaff,
inset 0 0 8px white;

}

#chatBox::-webkit-scrollbar-thumb:hover{

background:linear-gradient(
180deg,
#6cf8ff,
#00d9ff
);

box-shadow:
0 0 25px #00eaff;

}
  .message-wrapper{

display:flex;
width:100%;
animation:fadeIn .35s ease;

}

.user-wrapper{

justify-content:flex-end;

}

.jarvis-wrapper{

justify-content:flex-start;

}

.message{

max-width:72%;
padding:14px 18px;
border-radius:12px;
line-height:1.6;
font-size:15px;
word-wrap:break-word;
backdrop-filter:blur(10px);

}

.user-message{

background:rgba(255,179,0,.08);
border:1px solid rgba(255,179,0,.35);
color:#ffffff;
box-shadow:0 0 18px rgba(255,179,0,.10);

}

.jarvis-message{

background:rgba(0,234,255,.08);
border:1px solid rgba(0,234,255,.30);
color:#eaffff;
box-shadow:0 0 18px rgba(0,234,255,.10);

}

.input-area{

display:flex;
align-items:center;
gap:15px;
padding:16px;
border-top:1px solid var(--border);
background:rgba(0,10,18,.70);

}

#userInput{

flex:1;
padding:14px 18px;
background:#06131f;
border:1px solid var(--border);
border-radius:12px;
outline:none;
font-size:15px;
color:white;
transition:.30s;

}

#userInput:focus{

border-color:var(--cyan);
box-shadow:
0 0 18px rgba(0,234,255,.25);

}

button{

width:130px;
height:48px;
background:transparent;
border:1px solid var(--cyan);
border-radius:12px;
color:var(--cyan);
font-family:'Orbitron',sans-serif;
font-size:14px;
cursor:pointer;
transition:.30s;

}

button:hover{

background:var(--cyan);
color:#000;
box-shadow:0 0 20px var(--cyan);

}

button:active{

transform:scale(.97);

}

/* ===== SCROLL GENERAL ===== */

::-webkit-scrollbar{

width:12px;

}

::-webkit-scrollbar-track{

background:#04111d;

}

::-webkit-scrollbar-thumb{

background:linear-gradient(
180deg,
#00f0ff,
#0094ff
);

border-radius:30px;
border:2px solid #04111d;
box-shadow:
0 0 12px #00eaff;

}

::-webkit-scrollbar-thumb:hover{

background:linear-gradient(
180deg,
#7ffcff,
#00d5ff
);

box-shadow:
0 0 20px #00f0ff;

}

.fade-in{

animation:fadeIn .45s ease;

}

@keyframes fadeIn{

from{

opacity:0;
transform:translateY(18px);

}

to{

opacity:1;
transform:translateY(0);

}

}

.glow{

animation:glow 2s infinite alternate;

}

@keyframes glow{

from{

filter:drop-shadow(0 0 5px var(--cyan));

}

to{

filter:drop-shadow(0 0 22px var(--cyan));

}

}

</style>

</head>

<body>

<header>

<div class="logo">

STARK INDUSTRIES // J.A.R.V.I.S AI

</div>

<div class="status">

SYSTEM ONLINE // CORE v3.0

</div>

</header>

<div class="main">

<div class="sidebar">

<div class="panel">

<h3>MONITOREO DE SISTEMA</h3>
    <div class="metric">

<label>

<span>CPU CENTRAL</span>

<span id="cpuValue">28%</span>

</label>

<div class="progress">

<span style="width:28%"></span>

</div>

</div>

<div class="metric">

<label>

<span>MEMORIA RAM</span>

<span id="ramValue">64%</span>

</label>

<div class="progress">

<span style="width:64%"></span>

</div>

</div>

<div class="metric">

<label>

<span>GPU</span>

<span id="gpuValue">41%</span>

</label>

<div class="progress">

<span style="width:41%"></span>

</div>

</div>

<div class="metric">

<label>

<span>RED GLOBAL</span>

<span>ONLINE</span>

</label>

<div class="progress">

<span style="width:100%"></span>

</div>

</div>

<div class="metric">

<label>

<span>SEGURIDAD</span>

<span>100%</span>

</label>

<div class="progress">

<span style="width:100%"></span>

</div>

</div>

</div>

<div class="panel">

<h3>CONVERSACIONES</h3>

<div id="historyList">

<div class="history-item">

J.A.R.V.I.S iniciado

</div>

<div class="history-item">

Sistema operativo

</div>

<div class="history-item">

Esperando órdenes...

</div>

</div>

</div>

</div>

<div class="workspace">

<div class="chat">

<div id="chatBox">

<div class="message-wrapper jarvis-wrapper fade-in">

<div class="message jarvis-message">

<strong>J.A.R.V.I.S.</strong>

<br><br>

Buenos días, Señor.

<br><br>

Todos los sistemas están operativos.

<br>

Conexión con Groq establecida.

<br>

Esperando instrucciones.

</div>

</div>

</div>

<div class="input-area">

<input

type="text"

id="userInput"

placeholder="Escriba una orden para J.A.R.V.I.S..."

autocomplete="off"

onkeypress="handleKeyPress(event)"

>

<button onclick="sendMessage()">

ENVIAR

</button>

</div>

</div>

</div>

</div>

<script src="js/api.js"></script>

<script src="js/chat.js"></script>

<script src="js/core.js"></script>

<script>

document.addEventListener("DOMContentLoaded",()=>{

if(typeof initChat==="function"){

initChat();

}

});

</script>

</body>

</html>
