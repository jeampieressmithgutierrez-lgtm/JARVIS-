<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#05070b"
    >

    <meta
        name="description"
        content="J.A.R.V.I.S. — Stark Industries"
    >

    <title>J.A.R.V.I.S. • Stark Industries</title>


    <!-- =====================================================
         FUENTES
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         THREE.JS
    ====================================================== -->

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/hud.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/jarvis-intro.css">

</head>


<body>


    <!-- =====================================================
         INTRO
    ====================================================== -->

    <div
        id="jarvis-intro"
        aria-hidden="true"
    >

        <div class="intro-cinema">

            <div
                class="intro-logo"
                aria-label="J.A.R.V.I.S."
            >

                <span class="intro-j-space">J</span>

                <span class="intro-letter intro-j">J</span>
                <span class="intro-letter intro-dot">.</span>
                <span class="intro-letter intro-a">A</span>
                <span class="intro-letter intro-dot">.</span>
                <span class="intro-letter intro-r">R</span>
                <span class="intro-letter intro-dot">.</span>
                <span class="intro-letter intro-v">V</span>
                <span class="intro-letter intro-dot">.</span>
                <span class="intro-letter intro-i">I</span>
                <span class="intro-letter intro-dot">.</span>
                <span class="intro-letter intro-s">S</span>

            </div>

            <div class="intro-subtitle">
                ARTIFICIAL INTELLIGENCE
            </div>

            <div class="intro-status">

                <span class="intro-status-dot"></span>

                <span>STARK INDUSTRIES</span>

                <span class="intro-status-separator">
                    •
                </span>

                <span>COGNITIVE SYSTEM</span>

            </div>

        </div>

    </div>


    <!-- =====================================================
         FONDO
    ====================================================== -->

    <div id="background-container">

        <canvas
            id="particles-canvas"
            aria-hidden="true"
        ></canvas>

        <div id="grid-overlay"></div>

        <div id="scan-overlay"></div>

    </div>


    <!-- =====================================================
         HUD
    ====================================================== -->

    <div id="hud">


        <!-- =================================================
             TOPBAR
        ================================================== -->

        <header id="topbar">


            <!-- JARVIS -->

            <div class="top-brand jarvis-brand">

                <div class="jarvis-title">
                    J.A.R.V.I.S.
                </div>

                <div class="jarvis-subtitle">
                    ARTIFICIAL INTELLIGENCE
                </div>

            </div>


            <!-- RELOJ -->

            <div class="top-center">

                <div
                    id="clock"
                    aria-label="Hora del sistema"
                >
                    00:00:00
                </div>

                <div class="system-line"></div>

            </div>


            <!-- STARK -->

            <div class="stark-header">

                <span class="stark-title">
                    STARK INDUSTRIES
                </span>

                <div class="stark-badge">
                    ADVANCED SYSTEMS DIVISION
                </div>

                <div class="system-state">

                    <span id="status-light"></span>

                    <span>
                        ONLINE
                    </span>

                </div>

            </div>

        </header>


        <!-- =================================================
             MAIN
        ================================================== -->

        <div id="main-layout">


            <!-- =================================================
                 SIDEBAR
            ================================================== -->

            <aside id="sidebar">


                <!-- BUSCADOR -->

                <section class="sidebar-section search-section">

                    <div class="section-label">
                        BUSCAR CHATS
                    </div>

                    <div class="chat-search">

                        <span
                            class="search-icon"
                            aria-hidden="true"
                        >
                            ⌕
                        </span>

                        <input
                            id="chatSearchInput"
                            type="text"
                            placeholder="Buscar conversaciones..."
                            autocomplete="off"
                            aria-label="Buscar conversaciones"
                        >

                    </div>

                </section>


                <!-- HISTORIAL -->

                <section class="sidebar-section history-section">

                    <div class="history-header">

                        <div class="section-label">
                            HISTORIAL
                        </div>

                        <button
                            id="newChatButton"
                            type="button"
                            aria-label="Nueva conversación"
                            title="Nueva conversación"
                        >
                            +
                        </button>

                    </div>


                    <div id="chat-history">

                        <!-- chat.js genera las conversaciones -->

                    </div>

                </section>


                <!-- HERRAMIENTAS -->

                <section class="sidebar-section tools-section">

                    <button
                        id="toolsToggle"
                        class="tools-header"
                        type="button"
                        aria-expanded="false"
                    >

                        <span class="tools-symbol">
                            ◈
                        </span>

                        <span>
                            HERRAMIENTAS
                        </span>

                        <span class="tools-arrow">
                            ›
                        </span>

                    </button>


                    <div
                        id="toolsPanel"
                        class="tools-panel"
                    >

                        <button
                            type="button"
                            class="tool-item"
                        >
                            <span>◉</span>
                            VISIÓN
                        </button>

                        <button
                            type="button"
                            class="tool-item"
                        >
                            <span>⌁</span>
                            ANÁLISIS
                        </button>

                        <button
                            type="button"
                            class="tool-item"
                        >
                            <span>◇</span>
                            SISTEMA
                        </button>

                    </div>

                </section>


                <!-- USUARIO -->

                <section class="sidebar-section user-section">

                    <div class="section-label">
                        USUARIO
                    </div>


                    <div class="user-account">

                        <div
                            class="user-avatar"
                            aria-hidden="true"
                        >
                            ◉
                        </div>

                        <div class="user-info">

                            <div
                                id="user-name"
                                class="user-name"
                            >
                                Invitado
                            </div>

                            <div class="user-status">
                                SESIÓN TEMPORAL
                            </div>

                        </div>

                    </div>


                    <a
                        href="/auth/google"
                        id="google-login"
                        class="google-login"
                    >

                        <span class="google-icon">
                            G
                        </span>

                        <span class="google-text">
                            INICIAR CON GOOGLE
                        </span>

                    </a>

                </section>

            </aside>


            <!-- =================================================
                 CHAT
            ================================================== -->

            <main
                id="chat-container"
                aria-label="Consola de J.A.R.V.I.S."
            >


                <!-- NÚCLEO -->

                <section
                    id="jarvis-visual"
                    aria-label="Núcleo tridimensional de J.A.R.V.I.S."
                >

                    <div
                        id="jarvis-core-stage"
                        aria-hidden="true"
                    ></div>

                </section>


                <!-- COMPATIBILIDAD CON SISTEMA ANTIGUO -->

                <section
                    id="jarvis-interface"
                    aria-hidden="true"
                ></section>


                <!-- MENSAJES -->

                <div
                    id="messages"
                    aria-live="polite"
                    aria-label="Conversación"
                ></div>


                <!-- PROCESANDO -->

                <div
                    id="jarvisProcessing"
                    aria-hidden="true"
                ></div>

            </main>

        </div>


        <!-- =====================================================
             COMPOSER
        ====================================================== -->

        <footer id="console">

            <div class="console-wrapper">


                <!-- =================================================
                     CAMPO DE TEXTO
                ================================================== -->

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Escriba una instrucción..."
                    autocomplete="off"
                    aria-label="Escribir mensaje"
                >


                <!-- =================================================
                     MICRÓFONO
                     AHORA A LA DERECHA DEL INPUT
                ================================================== -->

                <button
                    id="voiceButton"
                    class="console-icon-button"
                    type="button"
                    aria-label="Entrada de voz"
                    title="Entrada de voz"
                >
                    🎙
                </button>


                <!-- =================================================
                     ESTADO
                ================================================== -->

                <div class="console-status">

                    <span></span>

                    READY

                </div>


                <!-- =================================================
                     COGNITIVE
                ================================================== -->

                <button
                    id="cognitiveButton"
                    class="cognitive-button"
                    type="button"
                    aria-label="Sistema cognitivo"
                    title="Sistema cognitivo"
                >

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </button>


                <!-- =================================================
                     ENVIAR
                ================================================== -->

                <button
                    id="sendButton"
                    type="button"
                    aria-label="Enviar mensaje"
                    title="Enviar mensaje"
                >
                    ➤
                </button>

            </div>

        </footer>

    </div>


    <!-- =====================================================
         JAVASCRIPT EXISTENTE
    ====================================================== -->

    <script src="js/core.js"></script>
    <script src="js/jarvis-intro.js"></script>
    <script src="js/background.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>


    <!-- =====================================================
         NÚCLEO THREE.JS
    ====================================================== -->

    <script
        type="module"
        src="js/script.js"
    ></script>


    <!-- =====================================================
         HERRAMIENTAS
    ====================================================== -->

    <script>

        (() => {

            const toggle =
                document.getElementById("toolsToggle");

            const panel =
                document.getElementById("toolsPanel");

            if (!toggle || !panel) {
                return;
            }

            toggle.addEventListener(
                "click",
                () => {

                    const abierto =
                        toggle.getAttribute(
                            "aria-expanded"
                        ) === "true";

                    toggle.setAttribute(
                        "aria-expanded",
                        String(!abierto)
                    );

                    panel.classList.toggle(
                        "tools-open",
                        !abierto
                    );

                }
            );

        })();

    </script>

</body>

</html>VV
