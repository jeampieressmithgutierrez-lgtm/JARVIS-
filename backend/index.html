<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#05070b"
    >

    <meta
        name="description"
        content="J.A.R.V.I.S. — Stark Industries"
    >

    <title>J.A.R.V.I.S. • Stark Industries</title>


    <!-- =====================================================
         FUENTES
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         CSS PRINCIPAL
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

    <link
        rel="stylesheet"
        href="css/hud.css"
    >

    <link
        rel="stylesheet"
        href="css/chat.css"
    >

    <link
        rel="stylesheet"
        href="css/animations.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="css/jarvis-intro.css"
    >

</head>


<body>


    <!-- =====================================================
         INTRO CINEMÁTICA J.A.R.V.I.S.
    ====================================================== -->

    <div
        id="jarvis-intro"
        aria-hidden="true"
    >

        <div class="intro-cinema">

            <div
                class="intro-logo"
                aria-label="J.A.R.V.I.S."
            >

                <span class="intro-j-space">J</span>

                <span class="intro-letter intro-j">J</span>

                <span class="intro-letter intro-dot">.</span>

                <span class="intro-letter intro-a">A</span>

                <span class="intro-letter intro-dot">.</span>

                <span class="intro-letter intro-r">R</span>

                <span class="intro-letter intro-dot">.</span>

                <span class="intro-letter intro-v">V</span>

                <span class="intro-letter intro-dot">.</span>

                <span class="intro-letter intro-i">I</span>

                <span class="intro-letter intro-dot">.</span>

                <span class="intro-letter intro-s">S</span>

            </div>


            <div class="intro-subtitle">
                ARTIFICIAL INTELLIGENCE
            </div>


            <div class="intro-status">

                <span class="intro-status-dot"></span>

                <span>STARK INDUSTRIES</span>

                <span class="intro-status-separator">
                    •
                </span>

                <span>COGNITIVE SYSTEM</span>

            </div>

        </div>

    </div>


    <!-- =====================================================
         FONDO PRINCIPAL
    ====================================================== -->

    <div id="background-container">

        <canvas id="particles-canvas"></canvas>

        <div id="grid-overlay"></div>

        <div id="scan-overlay"></div>

    </div>


    <!-- =====================================================
         HUD PRINCIPAL
    ====================================================== -->

    <div id="hud">


        <!-- =================================================
             BARRA SUPERIOR
        ================================================== -->

        <header id="topbar">


            <!-- =============================================
                 MARCA J.A.R.V.I.S.
            ============================================== -->

            <div class="top-brand jarvis-3d-brand">

                <div class="jarvis-3d-logo">

                    <!--
                        IMPORTANTE:
                        Antes había múltiples capas repetidas
                        de J.A.R.V.I.S.
                        Ahora existe una sola marca.
                    -->

                    <div class="jarvis-front">
                        J.A.R.V.I.S.
                    </div>

                </div>


                <div class="jarvis-subtitle-3d">
                    ARTIFICIAL INTELLIGENCE
                </div>

            </div>


            <!-- =============================================
                 RELOJ CENTRAL
            ============================================== -->

            <div class="top-center">

                <div
                    id="clock"
                    aria-label="Hora del sistema"
                >
                    00:00:00
                </div>

                <div class="system-line"></div>

            </div>


            <!-- =============================================
                 STARK INDUSTRIES
            ============================================== -->

            <div class="stark-brand">

                <div class="stark-logo">
                    STARK INDUSTRIES
                </div>


                <div class="system-state">

                    <span id="status-light"></span>

                    <span>
                        ONLINE
                    </span>

                </div>

            </div>

        </header>


        <!-- =================================================
             CUERPO PRINCIPAL
        ================================================== -->

        <div id="main-layout">


            <!-- =================================================
                 SIDEBAR
                 
                 ORDEN:
                 1. BUSCAR
                 2. HISTORIAL
                 3. HERRAMIENTAS
                 4. USUARIO
            ================================================== -->

            <aside
                id="sidebar"
                aria-label="Panel lateral de J.A.R.V.I.S."
            >


                <!-- =========================================
                     BUSCAR CHAT
                ========================================== -->

                <section
                    class="sidebar-section search-section"
                    aria-label="Buscar conversaciones"
                >

                    <div class="chat-search">

                        <span
                            class="search-icon"
                            aria-hidden="true"
                        >
                            ⌕
                        </span>


                        <!--
                            ID compatible con la lógica de búsqueda.
                            Se conserva como elemento único.
                        -->

                        <input
                            id="chatSearch"
                            type="text"
                            placeholder="Buscar Chat..."
                            autocomplete="off"
                            aria-label="Buscar conversaciones"
                        >

                    </div>

                </section>


                <!-- =========================================
                     HISTORIAL
                ========================================== -->

                <section
                    class="sidebar-section history-section"
                    aria-label="Historial de conversaciones"
                >

                    <div class="history-header">

                        <div class="section-label">
                            HISTORIAL
                        </div>


                        <button
                            id="newChatButton"
                            type="button"
                            aria-label="Nueva conversación"
                            title="Nueva conversación"
                        >
                            +
                        </button>

                    </div>


                    <!-- =====================================
                         HISTORIAL DINÁMICO
                         
                         chat.js escribe aquí.
                    ====================================== -->

                    <div
                        id="chat-history"
                        aria-label="Conversaciones anteriores"
                    >

                        <!--
                            Las conversaciones son generadas
                            dinámicamente por chat.js.
                        -->

                    </div>

                </section>


                <!-- =========================================
                     HERRAMIENTAS
                ========================================== -->

                <section
                    class="sidebar-section tools-section"
                    aria-label="Herramientas"
                >

                    <div class="tools-header">

                        <div class="section-label">
                            HERRAMIENTAS
                        </div>

                    </div>


                    <div class="tools-list">


                        <!--
                            Estas opciones son visuales por ahora.
                            No interfieren con chat.js.
                        -->

                        <button
                            class="tool-item"
                            type="button"
                            title="Cámara"
                        >

                            <span
                                class="tool-icon"
                                aria-hidden="true"
                            >
                                ◉
                            </span>

                            <span>
                                WEBCAM
                            </span>

                        </button>


                        <button
                            class="tool-item"
                            type="button"
                            title="Archivos"
                        >

                            <span
                                class="tool-icon"
                                aria-hidden="true"
                            >
                                ▣
                            </span>

                            <span>
                                ARCHIVOS
                            </span>

                        </button>


                        <button
                            class="tool-item"
                            type="button"
                            title="Otros recursos"
                        >

                            <span
                                class="tool-icon"
                                aria-hidden="true"
                            >
                                ◇
                            </span>

                            <span>
                                OTROS
                            </span>

                        </button>

                    </div>

                </section>


                <!-- =========================================
                     USUARIO / INVITADO
                ========================================== -->

                <section
                    class="sidebar-section user-section"
                    aria-label="Cuenta de usuario"
                >

                    <div class="section-label">
                        USUARIO
                    </div>


                    <div class="user-account">


                        <!-- =================================
                             AVATAR
                        ================================== -->

                        <div
                            class="user-avatar"
                            aria-hidden="true"
                        >
                            ◉
                        </div>


                        <!-- =================================
                             INFORMACIÓN
                        ================================== -->

                        <div class="user-info">

                            <div
                                id="user-name"
                                class="user-name"
                            >
                                Invitado
                            </div>


                            <div class="user-status">
                                SESIÓN TEMPORAL
                            </div>

                        </div>

                    </div>


                    <!-- =====================================
                         ACCESO GOOGLE
                    ====================================== -->

                    <a
                        href="/auth/google"
                        id="google-login"
                        class="google-login"
                        aria-label="Iniciar sesión con Google"
                    >

                        <span
                            class="google-icon"
                            aria-hidden="true"
                        >
                            G
                        </span>

                        <span>
                            INICIAR CON GOOGLE
                        </span>

                    </a>


                    <!-- =====================================
                         ACCESOS SOCIALES / FUTUROS
                    ====================================== -->

                    <div
                        class="login-options"
                        aria-label="Opciones de acceso"
                    >


                        <button
                            type="button"
                            class="login-option"
                            title="Apple"
                        >

                            <span
                                aria-hidden="true"
                            >
                                
                            </span>

                            <small>
                                Apple
                            </small>

                        </button>


                        <button
                            type="button"
                            class="login-option"
                            title="Facebook"
                        >

                            <span
                                aria-hidden="true"
                            >
                                f
                            </span>

                            <small>
                                Facebook
                            </small>

                        </button>


                    </div>

                </section>

            </aside>


            <!-- =================================================
                 ÁREA CENTRAL DEL CHAT
            ================================================== -->

            <main
                id="chat-container"
                aria-label="Consola de J.A.R.V.I.S."
            >


                <!-- =============================================
                     VISUAL CENTRAL
                     
                     NO RESERVA ESPACIO.
                     
                     Queda detrás de los mensajes.
                     Aquí colocaremos posteriormente la imagen
                     de referencia.
                ============================================== -->

                <div
                    id="jarvis-visual"
                    aria-hidden="true"
                >

                    <div
                        id="jarvis-visual-aura"
                    ></div>


                    <div
                        id="jarvis-visual-frame"
                    >

                        <div
                            id="jarvis-visual-placeholder"
                        >

                            <!--
                                IMAGEN J.A.R.V.I.S.

                                La colocaremos aquí posteriormente.

                                Ejemplo futuro:
                                <img src="..." alt="">
                            -->

                        </div>

                    </div>

                </div>


                <!-- =============================================
                     MENSAJES
                     
                     Siempre por encima del visual.
                ============================================== -->

                <div
                    id="messages"
                    aria-live="polite"
                    aria-label="Conversación"
                >

                    <!--
                        chat.js genera aquí los mensajes.
                    -->

                </div>

            </main>

        </div>


        <!-- =====================================================
             CONSOLA INFERIOR
        ====================================================== -->

        <footer
            id="console"
            aria-label="Entrada de J.A.R.V.I.S."
        >

            <div class="console-wrapper">


                <!-- =============================================
                     BOTÓN COGNITIVO
                     
                     Visualmente preparado.
                ============================================== -->

                <button
                    id="cognitiveButton"
                    class="console-icon-button cognitive-button"
                    type="button"
                    aria-label="Sistema cognitivo"
                    title="Sistema cognitivo"
                >

                    <span aria-hidden="true">
                        ◉
                    </span>

                </button>


                <!-- =============================================
                     CAMPO DE MENSAJE
                     
                     ESTE ID NO CAMBIA.
                     chat.js depende de él.
                ============================================== -->

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Ingrese su solicitud...."
                    autocomplete="off"
                    aria-label="Escribir mensaje"
                >


                <!-- =============================================
                     MICRÓFONO
                     
                     ESTE ID NO CAMBIA.
                     chat.js depende de él.
                ============================================== -->

                <button
                    id="voiceButton"
                    class="console-icon-button"
                    type="button"
                    aria-label="Entrada de voz"
                    title="Entrada de voz"
                >

                    🎙

                </button>


                <!-- =============================================
                     ESTADO
                ============================================== -->

                <div class="console-status">

                    <span></span>

                    READY

                </div>


                <!-- =============================================
                     ENVIAR
                     
                     ESTE ID NO CAMBIA.
                     chat.js depende de él.
                ============================================== -->

                <button
                    id="sendButton"
                    type="button"
                    aria-label="Enviar mensaje"
                >
                    ENVIAR
                </button>

            </div>

        </footer>

    </div>


    <!-- =====================================================
         JAVASCRIPT
         
         ORDEN CONSERVADO.
         
         NO SE CAMBIA LA LÓGICA DEL CHAT.
    ====================================================== -->

    <script src="js/core.js"></script>

    <script src="js/jarvis-intro.js"></script>

    <script src="js/background.js"></script>

    <script src="js/particles.js"></script>

    <script src="js/effects.js"></script>

    <script src="js/ui.js"></script>

    <script src="js/chat.js"></script>

    <script src="js/api.js"></script>

    <script src="js/main.js"></script>


</body>

</html>
