<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>J.A.R.V.I.S. — Stark Interface</title>

    <!-- =====================================================
         FUENTES
    ====================================================== -->
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet"
    >

    <!-- =====================================================
         ESTILOS
    ====================================================== -->
    <link rel="stylesheet" href="/css/styles.css">

    <!-- =====================================================
         THREE.JS IMPORT MAP
         
         Three.js recomienda importar el núcleo y los addons
         desde la misma versión y CDN.
    ====================================================== -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <!-- =====================================================
         ESCENA 3D
         Este canvas queda detrás de toda la interfaz.
    ====================================================== -->
    <div id="three-background" aria-hidden="true"></div>

    <!-- =====================================================
         CAPA HUD
    ====================================================== -->
    <div id="hud">

        <!-- =================================================
             SIDEBAR
        ================================================== -->
        <aside id="sidebar" class="glass-panel">

            <div class="sidebar-search">
                <span class="ui-icon">⌕</span>
                <input
                    id="chatSearch"
                    type="text"
                    placeholder="Buscar chats..."
                    autocomplete="off"
                >
            </div>

            <section class="history-section">

                <div class="section-heading">
                    <span>HISTORIAL</span>

                    <button
                        id="newChatButton"
                        type="button"
                        aria-label="Nuevo chat"
                    >
                        +
                    </button>
                </div>

                <div id="chat-history"></div>

            </section>

            <section class="tools-section">

                <button
                    id="toolsButton"
                    class="glass-button"
                    type="button"
                >
                    ✦ HERRAMIENTAS
                </button>

            </section>

            <section class="user-section">

                <div class="user-status">
                    <span class="status-dot"></span>

                    <div>
                        <strong>USUARIO</strong>
                        <small id="userStatus">
                            INVITADO
                        </small>
                    </div>
                </div>

                <div class="login-methods">

                    <button
                        class="login-method"
                        type="button"
                        aria-label="Google"
                    >
                        G
                    </button>

                    <button
                        class="login-method"
                        type="button"
                        aria-label="Apple"
                    >
                        
                    </button>

                    <button
                        class="login-method"
                        type="button"
                        aria-label="Facebook"
                    >
                        f
                    </button>

                </div>

            </section>

        </aside>

        <!-- =================================================
             ÁREA PRINCIPAL
        ================================================== -->
        <main id="main-interface">

            <!-- =============================================
                 TOPBAR
            ============================================== -->
            <header id="topbar">

                <div class="jarvis-brand">
                    <div class="jarvis-name">
                        J.A.R.V.I.S.
                    </div>

                    <div class="jarvis-subtitle">
                        ARTIFICIAL INTELLIGENCE
                    </div>
                </div>

                <div id="system-clock">
                    00:00:00
                </div>

                <div class="stark-brand">
                    <div class="stark-mark">
                        S
                    </div>

                    <div>
                        <strong>STARK</strong>
                        <span>INDUSTRIES</span>
                    </div>
                </div>

            </header>

            <!-- =============================================
                 CHAT
            ============================================== -->
            <section id="chat-container">

                <!-- =========================================
                     ORBE 3D
                     ====================================== -->
                <div
                    id="jarvis-core-stage"
                    aria-hidden="true"
                ></div>

                <!-- =========================================
                     MENSAJES
                     ====================================== -->
                <div id="messages"></div>

                <!-- =========================================
                     COMPOSER FLOTANTE
                     ====================================== -->
                <div id="console">

                    <div class="console-wrapper">

                        <input
                            id="messageInput"
                            type="text"
                            placeholder="Escriba una instrucción..."
                            autocomplete="off"
                        >

                        <button
                            id="voiceButton"
                            type="button"
                            aria-label="Micrófono"
                        >
                            <span class="mic-icon">◉</span>
                        </button>

                        <button
                            id="cognitiveButton"
                            type="button"
                            aria-label="Funciones cognitivas"
                        >
                            <span class="cognitive-dots">
                                • •
                                <br>
                                • •
                            </span>
                        </button>

                        <button
                            id="sendButton"
                            type="button"
                            aria-label="Enviar mensaje"
                        >
                            ➤
                        </button>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <!-- =====================================================
         LÓGICA 3D
    ====================================================== -->
    <script
        type="module"
        src="/js/script.js"
    ></script>

</body>
</html>
