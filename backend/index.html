<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>J.A.R.V.I.S. • Stark Industries</title>


<!-- =====================================================
     FUENTES
===================================================== -->

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&family=Share+Tech+Mono&display=swap"
    rel="stylesheet"
>


<!-- =====================================================
     CSS
===================================================== -->

<link
    rel="stylesheet"
    href="css/styles.css"
>

<link
    rel="stylesheet"
    href="css/hud.css"
>

<link
    rel="stylesheet"
    href="css/chat.css"
>

<link
    rel="stylesheet"
    href="css/animations.css"
>

<link
    rel="stylesheet"
    href="css/responsive.css"
>

</head>


<body>


<!-- =====================================================
     FONDO
===================================================== -->

<div id="background-container">

    <canvas
        id="particles-canvas"
    ></canvas>

    <div id="grid-overlay"></div>

    <div id="scan-overlay"></div>

</div>


<!-- =====================================================
     HUD
===================================================== -->

<div id="hud">


<!-- =====================================================
     ENCABEZADO
===================================================== -->

<header id="topbar">

    <div class="logo">

        <h1>
            STARK INDUSTRIES
        </h1>

        <p>
            J.A.R.V.I.S. Artificial Intelligence
        </p>

    </div>


    <div class="system-status">

        <span id="clock">
            00:00
        </span>

        <span id="status-light"></span>

    </div>

</header>


<!-- =====================================================
     CONTENIDO PRINCIPAL
===================================================== -->

<div id="main-layout">


<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside id="sidebar">


<!-- =====================================================
     SISTEMA
===================================================== -->

<section class="panel system-panel">

    <h2>
        Sistema
    </h2>


    <div class="system-item">

        <span>
            J.A.R.V.I.S. CORE
        </span>

        <strong class="status-online">
            ● ACTIVO
        </strong>

    </div>


    <div class="system-item">

        <span>
            GROQ
        </span>

        <strong class="status-online">
            ● CONECTADO
        </strong>

    </div>


    <div class="system-item">

        <span>
            RENDER
        </span>

        <strong class="status-online">
            ● ACTIVO
        </strong>

    </div>


    <div class="system-item">

        <span>
            GITHUB
        </span>

        <strong class="status-online">
            ● CONECTADO
        </strong>

    </div>

</section>


<!-- =====================================================
     USUARIO
===================================================== -->

<section class="panel user-panel">

    <h2>
        Usuario
    </h2>


    <div id="user-info">

        <div id="user-name">
            Invitado
        </div>


        <a
            href="/auth/google"
            id="google-login"
        >
            🔵 Iniciar sesión con Google
        </a>

    </div>

</section>


<!-- =====================================================
     HISTORIAL
===================================================== -->

<section class="panel history-panel">

    <div class="history-header">

        <h2>
            Historial
        </h2>


        <button
            id="newChatButton"
            type="button"
            title="Crear nueva conversación"
        >
            +
        </button>

    </div>


    <div id="chat-history">

        <!--
            Los chats serán generados
            dinámicamente por chat.js.
        -->

    </div>

</section>


</aside>


<!-- =====================================================
     CHAT
===================================================== -->

<main id="chat-container">

    <div id="messages">

        <!--
            Los mensajes serán generados
            dinámicamente por chat.js.
        -->

    </div>

</main>


</div>


<!-- =====================================================
     CONSOLA
===================================================== -->

<footer id="console">

    <input

        type="text"

        id="messageInput"

        placeholder="Escriba una instrucción..."

        autocomplete="off"

    >


    <button
        id="sendButton"
        type="button"
    >

        Enviar

    </button>

</footer>


</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="js/core.js"></script>

<script src="js/background.js"></script>

<script src="js/particles.js"></script>

<script src="js/effects.js"></script>

<script src="js/ui.js"></script>

<script src="js/chat.js"></script>

<script src="js/api.js"></script>

<script src="js/main.js"></script>


</body>

</html>
